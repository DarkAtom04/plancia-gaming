<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plancia Gaming</title>
<meta name="description" content="Notizie di videogiochi, offerte, giochi gratis, uscite, PC e handheld, tech e IA: tutto in un posto, aggiornato ogni 10 minuti.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0B0E17">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FF4A1C'/%3E%3Cpath d='M20 46V18h15c7 0 11 4 11 10s-4 10-11 10h-7v8z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
<script>try{const t=localStorage.getItem("pg.theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="util"><div class="wrap">
  <span id="today"></span>
  <span class="util-r"><span class="live" id="live"><i></i><span id="liveTxt">Caricamento…</span></span>
  <button type="button" class="forcebtn" id="forceBtn" title="Aggiorna adesso notizie e offerte"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span>Aggiorna ora</span></button>
  <button type="button" class="iconbtn" id="themeBtn" aria-label="Cambia tema" title="Tema chiaro, scuro o automatico">☾</button>
  <button type="button" class="iconbtn" id="setBtn" aria-label="Impostazioni" title="Impostazioni">⚙</button></span>
</div></div>

<header class="top" id="top">
  <div class="wrap bar">
    <a class="logo" href="#home" aria-label="Plancia Gaming, home"><b>PLANCIA</b><span>GAMING</span></a>
    <form class="search" id="searchForm" role="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Cerca tra notizie, offerte, uscite…" aria-label="Cerca" autocomplete="off"></form>
  </div>
  <nav class="wrap nav" id="nav" aria-label="Sezioni"></nav>
</header>

<div class="banner" id="banner" role="status" hidden></div>
<div class="ticker" id="ticker" hidden><div class="wrap"><span class="tk-tag">ULTIM'ORA</span><div class="tk-view"><div class="tk-track" id="tkTrack"></div></div></div></div>

<div class="trends" id="trends" hidden><div class="wrap"><span class="tr-lbl">Di tendenza</span><div class="tr-list"></div></div></div>

<main class="wrap" id="main"><div class="skeleton"><div></div><div></div><div></div></div></main>

<footer class="foot"><div class="wrap">
  <div><b>Plancia Gaming</b> raccoglie in automatico titoli, anteprime e link delle testate: ogni notizia si apre sul sito originale.</div>
  <div id="footSrc"></div>
</div></footer>

<button type="button" class="newpill" id="newPill" hidden></button>
<button type="button" class="totop" id="toTop" aria-label="Torna in cima" hidden>↑</button>
<div class="drawer" id="settings" hidden role="dialog" aria-modal="true" aria-labelledby="setTitle"><div class="shade" data-close-set="1"></div>
  <div class="panel"><div class="panel-h"><h2 id="setTitle">Impostazioni</h2><button type="button" class="iconbtn dark" id="setClose" data-close-set="1" aria-label="Chiudi">✕</button></div><div id="setBody"></div></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
